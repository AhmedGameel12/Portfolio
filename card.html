<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopwave - Product Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Card Container */
    .product-card {
      background: #ffffff;
      width: 320px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    /* Badge */
    .badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #6c5ce7;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 10;
    }

    /* Image Area */
    .card-image {
      width: 100%;
      height: 220px;
      background: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .card-image img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .product-card:hover .card-image img {
      transform: scale(1.08);
    }

    /* Content Area */
    .card-details {
      padding: 20px;
    }

    .brand {
      font-size: 0.8rem;
      color: #a0aec0;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .product-title {
      font-size: 1.2rem;
      color: #2d3748;
      margin: 5px 0 10px;
      font-weight: 700;
    }

    /* Color Selector */
    .color-options {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .color-options span {
      font-size: 0.8rem;
      color: #718096;
      margin-right: 4px;
    }

    .color-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
