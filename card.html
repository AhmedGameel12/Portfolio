<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopwave - Product Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Card Container */
    .product-card {
      background: #ffffff;
      width: 320px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    /* Badge */
    .badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #6c5ce7;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 10;
    }

    /* Image Area */
    .card-image {
      width: 100%;
      height: 220px;
      background: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .card-image img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      transition: transform 0.3s ease, opacity 0.2s ease;
    }

    .product-card:hover .card-image img {
      transform: scale(1.08);
    }

    /* Content Area */
    .card-details {
      padding: 20px;
    }

    .brand {
      font-size: 0.8rem;
      color: #a0aec0;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .product-title {
      font-size: 1.2rem;
      color: #2d3748;
      margin: 5px 0 10px;
      font-weight: 700;
    }

    /* Color Selector */
    .color-options {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .color-options span {
      font-size: 0.8rem;
      color: #718096;
      margin-right: 4px;
    }

    .color-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .color-btn:hover, .color-btn.active {
      transform: scale(1.2);
    }

    .color-black { background-color: #2d3748; }
    .color-blue { background-color: #3182ce; }
    .color-purple { background-color: #6c5ce7; }

    .color-black.active { border-color: #2d3748; outline: 2px solid #a0aec0; }
    .color-blue.active { border-color: #3182ce; outline: 2px solid #90cdf4; }
    .color-purple.active { border-color: #6c5ce7; outline: 2px solid #d6bcfa; }

    /* Footer / Action Area */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .price {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a202c;
    }

    .add-to-cart-btn {
      background-color: #6c5ce7;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .add-to-cart-btn:hover {
      background-color: #5a4bcf;
    }

    .add-to-cart-btn:active {
      transform: scale(0.96);
    }

    /* JS Feedback State */
    .add-to-cart-btn.added {
      background-color: #48bb78;
    }
  </style>
</head>
<body>

  <div class="product-card">
    <span class="badge">Popular</span>
    
    <div class="card-image">
      <img id="product-img" src="https://via.placeholder.com/200x200/6c5ce7/ffffff?text=Purple+Pods" alt="Shopwave Product">
    </div>

    <div class="card-details">
      <span class="brand">Shopwave Audio</span>
      <h2 class="product-title">WavePods Pro</h2>
      
      <div class="color-options">
        <span>Color:</span>
        <button class="color-btn color-purple active" data-color="6c5ce7" data-name="Purple Pods" aria-label="Purple"></button>
        <button class="color-btn color-blue" data-color="3182ce" data-name="Blue Pods" aria-label="Blue"></button>
        <button class="color-btn color-black" data-color="2d3748" data-name="Black Pods" aria-label="Black"></button>
      </div>

      <div class="card-footer">
        <span class="price">$129.99</span>
        <button class="add-to-cart-btn" id="cart-btn">
          Add to Cart
        </button>
      </div>
    </div>
  </div>

  <script>
    const colorButtons = document.querySelectorAll('.color-btn');
    const productImage = document.getElementById('product-img');
    const cartButton = document.getElementById('cart-btn');

    // Color Selector Switcher Logic
    colorButtons.forEach(button => {
      button.addEventListener('click', () => {
        // Remove active state from all buttons
        colorButtons.forEach(btn => btn.classList.remove('active'));
        
        // Add active state to clicked button
        button.classList.add('active');

        // Extract color and label data
        const colorHex = button.getAttribute('data-color');
        const colorName = button.getAttribute('data-name');

        // Smooth image swap transition
        productImage.style.opacity = '0';
        setTimeout(() => {
          productImage.src = `https://via.placeholder.com/200x200/${colorHex}/ffffff?text=${encodeURIComponent(colorName)}`;
          productImage.style.opacity = '1';
        }, 200);
      });
    });

    // Add to Cart Interactive State
    let isAdded = false;
    cartButton.addEventListener('click', () => {
      if (!isAdded) {
        cartButton.textContent = '✓ Added!';
        cartButton.classList.add('added');
        isAdded = true;

        // Reset state after 2.5 seconds
        setTimeout(() => {
          cartButton.textContent = 'Add to Cart';
          cartButton.classList.remove('added');
          isAdded = false;
        }, 2500);
      }
    });
  </script>

</body>
</html>
